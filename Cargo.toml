[package]
name = "qbedec"
version = "0.0.4"
edition = "2021"
description = "Decompiler for QuickBASIC 4.5 .exe files (BRUN + Stand-alone modes)"
license = "AGPL-3.0-or-later"
authors = ["cpaglebbeek"]
repository = "https://github.com/cpaglebbeek/QuickBasicEmulator_Decompiler"

[[bin]]
name = "qbedec"
path = "src/main.rs"

[lib]
name = "qbedec"
path = "src/lib.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
